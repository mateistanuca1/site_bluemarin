<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Administrare{% endblock %} · Bluemarin</title>
<style>
  :root{
    --brand:#6b98ed; --deep:#4048c9; --ink:#151515; --muted:#7a7a7a;
    --line:#e2e5ea; --soft:#f4f7fd; --ok:#1f8a4c; --err:#d1365c; --bg:#f7f8fa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--deep)}
  header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  .top-in{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .logo{font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:14px;color:var(--deep);text-decoration:none}
  nav.main{display:flex;gap:18px;flex:1;flex-wrap:wrap}
  nav.main a{font-size:13px;text-transform:uppercase;letter-spacing:.08em;text-decoration:none;color:var(--muted);font-weight:600}
  nav.main a:hover,nav.main a.on{color:var(--brand)}
  main{max-width:1100px;margin:0 auto;padding:28px 20px 70px}
  h1{font-size:24px;margin:0 0 6px}
  h2{font-size:17px;margin:34px 0 12px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:16px}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  .g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .stat{background:#fff;border:1px solid var(--line);border-radius:6px;padding:18px;text-align:center}
  .stat b{display:block;font-size:30px;color:var(--brand);line-height:1.1}
  .stat span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;background:var(--soft)}
  tr:last-child td{border-bottom:0}
  .btn{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--brand);background:var(--brand);
       color:#fff;padding:9px 18px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
       border-radius:4px;cursor:pointer;text-decoration:none;font-family:inherit}
  .btn:hover{background:#fff;color:var(--brand)}
  .btn.ghost{background:transparent;color:var(--brand)}
  .btn.ghost:hover{background:var(--brand);color:#fff}
  .btn.sm{padding:6px 12px;font-size:11px}
  .btn.danger{border-color:var(--err);background:transparent;color:var(--err)}
  .btn.danger:hover{background:var(--err);color:#fff}
  label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
        color:var(--muted);margin-bottom:5px}
  input[type=text],input[type=email],input[type=password],input[type=number],textarea,select{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:4px;font:inherit;font-size:14px;background:#fff}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px rgba(107,152,237,.18)}
  textarea{resize:vertical;min-height:84px}
  textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;min-height:62vh;line-height:1.5}
  .field{margin-bottom:14px}
  .flash{padding:11px 15px;border-radius:4px;margin-bottom:16px;font-size:14px;border-left:4px solid}
  .flash.success{background:#eaf7ef;border-color:var(--ok);color:#14532d}
  .flash.error{background:#fdecf1;border-color:var(--err);color:#7d1430}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;
        text-transform:uppercase;letter-spacing:.05em}
  .pill.new{background:#fdecf1;color:var(--err)}
  .pill.done{background:#eaf7ef;color:var(--ok)}
  .pill.kind{background:var(--soft);color:var(--deep)}
  details.group{border:1px solid var(--line);border-radius:5px;margin-bottom:10px;background:#fff}
  details.group>summary{padding:11px 15px;cursor:pointer;font-weight:600;font-size:14px;list-style:none;
                        display:flex;align-items:center;gap:8px}
  details.group>summary::-webkit-details-marker{display:none}
  details.group>summary::before{content:"▸";color:var(--brand);font-size:12px}
  details.group[open]>summary::before{content:"▾"}
  details.group>summary:hover{background:var(--soft)}
  .group-body{padding:4px 15px 15px;border-top:1px solid var(--line)}
  .group-body details.group{background:var(--soft)}
  .sticky-save{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);
               padding:13px 0;margin-top:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .muted{color:var(--muted);font-size:13px}
  .right{margin-left:auto}
  .row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .login-wrap{max-width:380px;margin:9vh auto;padding:0 20px}
  /* Camp de poza: previzualizare + incarcare pe loc */
  .imgfield{display:flex;gap:14px;align-items:flex-start}
  .imgfield__thumb{width:84px;height:84px;object-fit:cover;border:1px solid var(--line);
                   border-radius:5px;background:var(--soft);flex:none}
  .imgfield__thumb.is-missing{visibility:hidden}
  .imgfield__ctl{flex:1;min-width:0}
  .imgfield__actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:7px}
  .imgfield__status{font-size:12px}
  .imgfield__status.err{color:var(--err)}
  /* Biblioteca de poze */
  .media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
  .media-card{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;
              display:flex;flex-direction:column}
  .media-card img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--soft);display:block}
  .media-card__body{padding:9px 11px;font-size:12px;display:flex;flex-direction:column;gap:7px;flex:1}
  .media-card__name{font-weight:600;word-break:break-all;line-height:1.35}
  .media-card__row{display:flex;gap:6px;align-items:center;margin-top:auto}
  .dropzone{border:2px dashed var(--line);border-radius:7px;padding:26px;text-align:center;
            background:#fff;transition:border-color .15s,background .15s}
  .dropzone.is-over{border-color:var(--brand);background:var(--soft)}
  code{background:var(--soft);padding:2px 6px;border-radius:3px;font-size:13px}
  .filebox{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);
           border-radius:5px;margin-bottom:9px;background:#fff}
  @media (max-width:620px){ table,thead,tbody,th,td,tr{display:block} thead{display:none}
    td{border:0;padding:4px 0} tr{border-bottom:1px solid var(--line);padding:12px 0} }
</style>
</head>
<body>
{% if request.endpoint != 'admin.login' %}
<header class="top">
  <div class="top-in">
    <a class="logo" href="{{ url_for('admin.dashboard') }}">Bluemarin · Admin</a>
    <nav class="main">
      <a href="{{ url_for('admin.dashboard') }}" class="{{ 'on' if request.endpoint=='admin.dashboard' }}">Panou</a>
      <a href="{{ url_for('admin.content_index') }}" class="{{ 'on' if 'content' in (request.endpoint or '') }}">Continut</a>
      <a href="{{ url_for('admin.media_index') }}" class="{{ 'on' if 'media' in (request.endpoint or '') }}">Poze</a>
      <a href="{{ url_for('admin.submissions') }}" class="{{ 'on' if 'submission' in (request.endpoint or '') }}">Cereri</a>
    </nav>
    <form method="post" action="{{ url_for('admin.logout') }}">
      <button class="btn ghost sm" type="submit">Iesire</button>
    </form>
  </div>
</header>
{% endif %}

<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</main>

<script>
/* Incarcarea unei poze direct din campul de continut: alegi fisierul, pleaca
   la /api/admin/poze si adresa primita se scrie singura in camp. Fara reincarcarea
   paginii, ca sa nu pierzi restul modificarilor nesalvate. */
document.addEventListener('click', async (e) => {
  const pick = e.target.closest('[data-imgfield-pick]');
  if (!pick) return;
  const wrap = pick.closest('[data-imgfield]');
  wrap.querySelector('[data-imgfield-file]').click();
});

document.addEventListener('change', async (e) => {
  const file = e.target.closest('[data-imgfield-file]');
  if (!file || !file.files.length) return;

  const wrap = file.closest('[data-imgfield]');
  const input = wrap.querySelector('[data-imgfield-input]');
  const thumb = wrap.querySelector('.imgfield__thumb');
  const status = wrap.querySelector('[data-imgfield-status]');

  status.className = 'muted imgfield__status';
  status.textContent = 'Se încarcă…';

  const body = new FormData();
  body.append('file', file.files[0]);

  try {
    const res = await fetch('{{ url_for('admin.media_upload') }}', {
      method: 'POST',
      headers: { Accept: 'application/json' },
      body,
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Încărcarea a eșuat.');

    const up = data.uploaded[0];
    input.value = up.url;
    thumb.src = up.url;
    thumb.classList.remove('is-missing');
    status.textContent = `Gata — ${up.width}×${up.height}. Nu uita să salvezi.`;
  } catch (err) {
    status.className = 'muted imgfield__status err';
    status.textContent = err.message;
  } finally {
    file.value = '';
  }
});
</script>
</body>
</html>

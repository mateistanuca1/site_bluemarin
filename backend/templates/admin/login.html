{% extends "admin/base.html" %}
{% block title %}Autentificare{% endblock %}
{% block body %}
<div class="login-wrap">
  <h1 style="text-align:center">Bluemarin</h1>
  <p class="sub" style="text-align:center">Panou de administrare</p>

  <form method="post" class="card">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="username" autofocus>
    </div>
    <div class="field">
      <label for="password">Parola</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button class="btn" type="submit" style="width:100%;justify-content:center">Intra in cont</button>
  </form>
</div>
{% endblock %}
